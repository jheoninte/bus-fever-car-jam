<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Bus Fever! Car Jam Escape</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#0f172a;color:#f8fafc}.shell{display:grid;grid-template-columns:360px 1fr;min-height:100vh}.sidebar{padding:16px;background:#111827}.content{padding:16px;display:flex;align-items:center;justify-content:center}.lane{display:grid;grid-template-columns:repeat(5,88px);gap:10px}.car{width:88px;height:128px;border-radius:16px;padding:8px;border:none;cursor:pointer;color:#fff;font-weight:700;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 10px 24px rgba(0,0,0,.28)}.passenger{width:18px;height:18px;border-radius:50%;display:inline-block;margin-right:4px}.queue{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}.slot{width:56px;height:56px;border-radius:14px;border:2px dashed rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-weight:700}button{border:none;border-radius:10px;padding:10px 12px;background:#2563eb;color:white;cursor:pointer}.ghost{background:#334155}.hud{font-size:13px;color:#cbd5e1;line-height:1.5}</style></head><body><div class="shell"><aside class="sidebar"><h2 style="margin-top:0;">Bus Fever! Car Jam Escape</h2><div style="display:flex;gap:8px;flex-wrap:wrap;"><button id="shuffleBtn">Shuffle</button><button id="regenBtn" class="ghost">Next Seed</button><button id="cbBtn" class="ghost">Colorblind</button></div><div class="hud" id="hud" style="margin-top:12px;"></div><div style="margin-top:16px;"><div><b>Bus Slots</b></div><div id="slots" class="queue"></div></div></aside><main class="content"><div id="lane" class="lane"></div></main></div><script>const palette={red:'#ef4444',blue:'#3b82f6',green:'#22c55e',yellow:'#eab308',purple:'#a855f7',cyan:'#06b6d4'},symbols={red:'R',blue:'B',green:'G',yellow:'Y',purple:'P',cyan:'C'},alt={red:'●',blue:'▲',green:'■',yellow:'◆',purple:'✦',cyan:'✚'};const st={colorblind:false,score:0,seed:1,slots:[],cars:[]},lane=document.getElementById('lane'),slots=document.getElementById('slots'),hud=document.getElementById('hud');function level(seed){const colors=Object.keys(palette),cars=[];for(let i=0;i<10;i++){const stack=[],len=2+((seed+i)%3);for(let j=0;j<len;j++)stack.push(colors[(seed*3+i+j)%colors.length]);cars.push({id:i,gimmick:i===2?'mystery':i===6?'frozen':i===8?'tunnel':'normal',stack})}st.cars=cars;st.slots=[];render()}function sym(c){return st.colorblind?alt[c]:symbols[c]}function flush(){const cnt={};st.slots.forEach(c=>cnt[c]=(cnt[c]||0)+1);const hit=Object.keys(cnt).find(c=>cnt[c]>=3);if(!hit)return;let rm=0;st.slots=st.slots.filter(c=>{if(c===hit&&rm<3){rm++;return false}return true});st.score+=30}function tap(id){const car=st.cars.find(c=>c.id===id);if(!car||!car.stack.length||st.slots.length>=7)return;if(car.gimmick==='frozen'&&car.stack.length>1)return;let p=car.stack.shift();if(car.gimmick==='mystery')p=Object.keys(palette)[Math.floor(Math.random()*6)];st.slots.push(p);if(car.gimmick==='tunnel'&&car.stack.length)st.slots.push(car.stack.pop());flush();render()}function render(){lane.innerHTML='';st.cars.forEach(car=>{const b=document.createElement('button');b.className='car';b.style.background='#1f2937';b.onclick=()=>tap(car.id);const top=car.stack[0];b.innerHTML=`<div>${car.gimmick.toUpperCase()}</div><div>${car.stack.map(c=>`<span class="passenger" style="background:${palette[c]}"></span>${sym(c)}`).join(' ')||'CLEAR'}</div><div>Top: ${top?sym(top):'-'}</div>`;lane.appendChild(b)});slots.innerHTML='';for(let i=0;i<7;i++){const el=document.createElement('div');el.className='slot';const color=st.slots[i];if(color){el.style.background=palette[color];el.textContent=sym(color)}slots.appendChild(el)}const cleared=st.cars.filter(c=>c.stack.length===0).length;hud.innerHTML=`Seed ${st.seed} · Score ${st.score}<br/>Cleared Cars: ${cleared}/10<br/>Slot Load: ${st.slots.length}/7`}document.getElementById('shuffleBtn').onclick=()=>{st.cars.forEach(c=>c.stack.sort(()=>Math.random()-.5));render()};document.getElementById('regenBtn').onclick=()=>{st.seed+=1;level(st.seed)};document.getElementById('cbBtn').onclick=e=>{st.colorblind=!st.colorblind;e.target.textContent=st.colorblind?'Standard Colors':'Colorblind';render()};level(1);</script></body></html>
